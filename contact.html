<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact – How About Tennis</title>
  <meta name="description" content="Frage oder Match-Anfrage? Schreib mir über das Kontaktformular.">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Jost:ital,wght@0,700;1,500&amp;family=Montserrat:wght@400;500;700&amp;display=swap">
  <link rel="stylesheet" href="style.css">
</head>

<body class="page-contact">

  <!-- HEADER -->
  <header class="header">

    <!-- Desktop: Links links -->
    <nav class="nav-left" aria-label="Navigation links">
      <a href="index.html">HOME</a>
      <button class="theme-button" type="button">
        <svg class="icon-theme" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 1.5a9.5 9.5 0 0 0 0 19z" fill="currentColor"/></svg>
        FARBMODUS
      </button>
    </nav>

    <a class="logo" href="index.html">
      <img src="img/logo.png" alt="How About Tennis – zur Startseite" width="117" height="46">
    </a>

    <!-- Desktop: Links rechts -->
    <nav class="nav-right" aria-label="Navigation rechts">
      <a href="about.html">ABOUT ME</a>
      <a href="contact.html" class="active">CONTACT</a>
    </nav>

    <!-- Mobile: Farbmodus-Icon und Burger-Menü -->
    <button class="theme-button theme-button-icon" type="button" aria-label="Farbmodus wechseln">
      <svg class="icon-theme" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 1.5a9.5 9.5 0 0 0 0 19z" fill="currentColor"/></svg>
    </button>
    <button class="menu-button" type="button" aria-label="Menü öffnen">
      <svg class="icon-burger" viewBox="0 0 24 18" aria-hidden="true"><path d="M0 1h24M0 9h24M0 17h24" stroke="currentColor" stroke-width="2"/></svg>
      <svg class="icon-close" viewBox="0 0 18 18" aria-hidden="true"><path d="M1 1l16 16M17 1 1 17" stroke="currentColor" stroke-width="2"/></svg>
    </button>

    <!-- Mobile: aufgeklapptes Menü -->
    <nav class="nav-mobile" aria-label="Menü">
      <ul>
        <li><a href="index.html">HOME</a></li>
        <li><a href="about.html">ABOUT ME</a></li>
        <li><a href="contact.html" class="active">CONTACT</a></li>
        <li>
          <button class="theme-button" type="button">
            FARBMODUS
            <svg class="icon-theme" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 1.5a9.5 9.5 0 0 0 0 19z" fill="currentColor"/></svg>
          </button>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>CONTACT</h1>
      <p class="subtitle">Frage oder Match-Anfrage? Schreib mir.</p>
    </section>

    <div class="contact">
      <img class="photo contact-photo" src="img/contact-court.png" alt="Luftaufnahme einer Tennisspielerin auf einem grünen Platz" width="299" height="652">

      <form class="contact-form" action="#" method="post">
        <div class="field-row">
          <div class="field">
            <label for="name">NAME</label>
            <input type="text" id="name" name="name" placeholder="NAME" required>
          </div>
          <div class="field">
            <label for="email">E-MAIL</label>
            <input type="email" id="email" name="email" placeholder="NAME@BEISPIEL.CH" required>
          </div>
        </div>

        <div class="field">
          <label for="request">REQUEST TYPE</label>
          <input type="text" id="request" name="request" placeholder="FRAGE ZUM SCHLÄGER">
        </div>

        <div class="field">
          <label for="message">DEINE NACHRICHT</label>
          <textarea id="message" name="message" placeholder="SCHREIBE HIER, WORUM ES GEHT." required></textarea>
        </div>

        <button class="button send-button" type="submit">SEND</button>
      </form>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2026 HOW ABOUT TENNIS - IM1</p>
    <a href="impressum.html">Impressum</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
