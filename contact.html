<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – How About Tennis</title>

  <!-- Montserrat + Ersatzschriften, falls Futura nicht installiert ist -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Jost:ital,wght@0,700;1,500&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <!-- Gewählten Farbmodus sofort setzen -->
  <script>
    try { if (localStorage.getItem('hat-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  </script>
</head>
<body>
<div class="frame">

  <!-- ===================== 01 HEADER ===================== -->
  <header class="site-header">
    <nav class="navbar">
      <div class="nav-left">
        <a href="index.html" class="nav-link nav-home">HOME</a>
        <button type="button" class="nav-link theme-toggle" id="themeToggle">
          <svg class="theme-icon" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M15.75 9C15.75 12.7279 12.7279 15.75 9 15.75C5.27208 15.75 2.25 12.7279 2.25 9C2.25 5.27208 5.27208 2.25 9 2.25C12.7279 2.25 15.75 5.27208 15.75 9Z" stroke="currentColor" stroke-width="1.5"/>
            <path d="M9 2.25C7.20979 2.25 5.4929 2.96116 4.22703 4.22703C2.96116 5.4929 2.25 7.20979 2.25 9C2.25 10.7902 2.96116 12.5071 4.22703 13.773C5.4929 15.0388 7.20979 15.75 9 15.75V2.25Z" fill="currentColor" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <span class="theme-label">FARBMODUS</span>
        </button>
      </div>

      <img class="logo" src="assets/logo.png" alt="Tennis" width="117" height="46">

      <div class="nav-right">
        <a href="about.html" class="nav-link nav-about">ABOUT ME</a>
        <span class="nav-link nav-contact is-active" aria-current="page">CONTACT</span>
      </div>

      <!-- Linie «THIS PAGE» unter der aktuellen Seite -->
      <span class="nav-indicator" aria-hidden="true"></span>
    </nav>
  </header>

  <!-- ===================== 02 MAIN ===================== -->
  <main>
  <section class="page-contact">
    <div class="hero">
      <h1>CONTACT</h1>
      <p class="subtitle subtitle-cap">Frage oder Match-Anfrage? Schreib mir.</p>
    </div>

    <div class="contact-layout">
      <div class="photo contact-photo">
        <img src="assets/contact-foto.png" alt="Tennisplatz von oben">
      </div>
      <form class="contact-form">
        <div class="field field-half">
          <label for="name">NAME</label>
          <input type="text" id="name" name="name" placeholder="NAME">
        </div>
        <div class="field field-half">
          <label for="email">E-MAIL</label>
          <input type="email" id="email" name="email" placeholder="NAME@BEISPIEL.CH">
        </div>
        <div class="field field-type">
          <label for="type">REQUEST TYPE</label>
          <input type="text" id="type" name="type" placeholder="FRAGE ZUM SCHLÄGER">
        </div>
        <div class="field field-msg">
          <label for="message">DEINE NACHRICHT</label>
          <textarea id="message" name="message" placeholder="SCHREIBE HIER, WORUM ES GEHT."></textarea>
        </div>
        <button type="button" class="btn-send">SEND</button>
      </form>
    </div>
  </section>
  </main>

  <!-- ===================== 03 FOOTER ===================== -->
  <footer class="site-footer">
    <p>© 2026 HOW ABOUT TENNIS&nbsp;&nbsp;- IM1</p>
    <a href="impressum.html">Impressum AGB</a>
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
